{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MealBridge - Home Login</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="home-login.css">

</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="login-card bg-white shadow-xl rounded-xl p-8 w-full max-w-md">


<!-- Logo -->
<div class="text-center mb-6">
<h1 class="text-3xl font-bold text-green-600">
<i class="fas fa-home mr-2"></i>MealBridge
</h1>
<p class="text-gray-500">Home Login</p>
</div>

<form method="POST" action="{% url 'home_login' %}">
    {% csrf_token %}

<!-- Email -->
<div class="mb-4">
<label class="font-medium">Email</label>
<input name="email" type="email" required
class="w-full border p-3 rounded-lg mt-1"
placeholder="example@email.com">
</div>

<!-- Password -->
<div class="mb-6">
<label class="font-medium">Password</label>
<input name="password" type="password" required
class="w-full border p-3 rounded-lg mt-1">
</div>

<button type="submit"
class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-semibold">
<i class="fas fa-sign-in-alt mr-2"></i>Login
</button>

</form>

<!-- Register Link -->
<div class="text-center mt-6">
<p>
New Home?
<a href="{% url 'home-register' %"
class="text-green-600 font-medium hover:underline">
Register Here
</a>
</p>
</div>

<div class="text-center mt-4">
<a href="home.html" class="text-sm text-gray-500 hover:underline">
← Back to Home
</a>
</div>

</div>



</body>
</html>
