{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | MealBridge</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
</head>
<body class="bg-gray-100">

<div class="min-h-screen flex items-center justify-center py-10">

    <div class="bg-white shadow-xl rounded-xl w-full max-w-2xl p-8">

        <div class="text-center mb-8">
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                 class="w-28 h-28 rounded-full mx-auto mb-4">

            <h1 class="text-3xl font-bold text-green-600">
                My Profile
            </h1>

            <p class="text-gray-500">
                Update your personal information
            </p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-5">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'update_profile' %}">
            {% csrf_token %}

            <div class="mb-5">
                <label class="block font-semibold mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ donor.name }}"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none"
                    required>
            </div>

            <div class="mb-5">
                <label class="block font-semibold mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ donor.email }}"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none"
                    required>
            </div>

            <div class="mb-6">
                <label class="block font-semibold mb-2">
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    value="{{ donor.phone }}"
                    class="w-full border rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 outline-none"
                    required>
            </div>

            <div class="flex justify-between">

                <a href="{% url 'donar_dashboard' %}"
                   class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-lg">
                    Back
                </a>

                <button
                    type="submit"
                    class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-lg">
                    Update Profile
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
