{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MealBridge - Donor Register</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="{% static 'css/donar-registration.css' %}">
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-md">

<!-- Logo -->
<div class="text-center mb-6">
<h1 class="text-3xl font-bold text-green-600">
<i class="fas fa-utensils mr-2"></i>MealBridge
</h1>
<p class="text-gray-500">Create Donor Account</p>
</div>

<!-- ✅ IMPORTANT FORM -->
<form method="POST" action="{% url 'donar_register' %}">
{% csrf_token %}

<!-- Name -->
<div class="mb-4">
<label class="font-medium">Name</label>
<input name="name" required
class="w-full border p-3 rounded-lg mt-1">
</div>

<!-- Email -->
<div class="mb-4">
<label class="font-medium">Email</label>
<input name="email" type="email" required
class="w-full border p-3 rounded-lg mt-1">
</div>

<!-- Phone -->
<div class="mb-4">
<label class="font-medium">Phone</label>
<input name="phone" required
class="w-full border p-3 rounded-lg mt-1">
</div>

<!-- Password -->
<div class="mb-6">
<label class="font-medium">Password</label>
<input name="password" type="password" required
class="w-full border p-3 rounded-lg mt-1">
</div>

<button type="submit"
class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-semibold">
<i class="fas fa-user-plus mr-2"></i>Register
</button>

</form>

<!-- Login Link -->
<div class="text-center mt-6">
Already have account?
<a href="{% url 'donar_login' %}"
class="text-green-600 font-medium hover:underline">
Login Here
</a>
</div>

</div>

</body>
</html>
